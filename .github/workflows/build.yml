name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 失败时把构建日志推回 ci-logs 分支，便于在仓库外直接读取
permissions:
  contents: write

jobs:
  # ───────────── 规则引擎算法验证（秒级反馈，先挂再说）─────────────
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 算法用例
        run: python tests/run_tests.py

      - name: 种子规则行为
        run: python tools/simulate.py

      - name: App ↔ Tweak 配置格式一致性
        run: python tools/verify_tweak_config.py

      - name: 规则自动升级阈值
        run: python tools/verify_promotion.py

  # ───────────── C++ 核心库编译 + 单元测试 ─────────────
  # 用 ubuntu 而不是 macOS：标准 C++17，g++ 完全够用，还省 macOS 额度
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra \
            tests/test_core.cpp -o /tmp/test_core

      - name: Run tests
        run: /tmp/test_core

  # ───────────── iOS 产物：App(.tipa) + Tweak(.deb) ─────────────
  # 合并成一个 job 的原因：macOS runner 每次分配都要排队，
  # 拆成两个 job 等于排两次队。串行编译只排一次。
  # 用 macos-15 的原因：macos-13 已于 2025-12 退役，标签仍在但无容量，
  # 表现为永远 queued、runner 未分配。
  build-ios:
    runs-on: macos-15
    needs: [test-core]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 环境探测
        run: |
          echo "=== runner ==="
          uname -m
          sw_vers
          echo "=== xcode ==="
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # ── App ──────────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build App
        id: app
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project CallGuard.xcodeproj \
            -scheme CallGuard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log | tail -80

      - name: Package .tipa
        if: steps.app.outcome == 'success'
        run: |
          set -e
          APP=$(find app/build -type d -name "CallGuard.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP" ]; then
            echo "找不到 CallGuard.app"
            exit 1
          fi
          echo "找到 $APP"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/

          # 先签 extension 再签主 App。TrollStore 安装时保留这里的 entitlements
          codesign --force --sign - \
            --entitlements app/CallGuardDirectory/CallGuardDirectory.entitlements \
            Payload/CallGuard.app/PlugIns/CallGuardDirectory.appex || true
          codesign --force --sign - \
            --entitlements app/CallGuard/CallGuard.entitlements \
            Payload/CallGuard.app || true

          codesign -d --entitlements - Payload/CallGuard.app 2>&1 || true

          zip -qry CallGuard.tipa Payload
          ls -lh CallGuard.tipa

      - name: 诊断 App 构建错误
        if: always() && steps.app.outcome != 'success'
        run: |
          echo "===== xcodebuild 日志尾部 ====="
          tail -50 /tmp/xcodebuild.log 2>/dev/null || echo "无日志文件"
          echo "===== 错误行 ====="
          grep -nE "error:|fatal error|BUILD FAILED|The following build commands failed" /tmp/xcodebuild.log 2>/dev/null | head -25 | while IFS= read -r l; do
            echo "::error title=xcodebuild::$l"
          done

      # ── Tweak ────────────────────────────────────────
      # App 编挂了也继续编 Tweak，一次拿到两边的错误，避免反复排队
      - name: Install Theos
        if: always()
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install SDKs
        if: always()
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$HOME/theos/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$HOME/theos/sdks/" || true
          ls "$HOME/theos/sdks"

      # Theos 编译完 .dylib 后要用 ldid 签名，但 $THEOS/bin 里的 ldid 是
      # submodule 二进制，--depth 1 克隆时经常缺失，表现为 "ldid: command not found"。
      # 显式装一份，并检查 Theos 自带的那份是否存在。
      - name: Install ldid
        if: always()
        run: |
          echo "=== Theos 自带 bin ==="
          ls -la "$HOME/theos/bin/" 2>/dev/null || echo "bin 目录不存在"
          echo "=== 系统 ldid ==="
          which ldid || echo "PATH 里没有 ldid"
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid 2>&1 | tail -5 || true
          fi
          command -v ldid && ldid -v 2>&1 | head -2 || echo "::error::ldid 安装失败"

      # Theos 打包 deb 优先用 $THEOS/bin/dm.pl（Perl 脚本），失败时回落 dpkg-deb。
      # macOS 自带的 perl 缺 Compress::Raw::Zlib 等模块，dm.pl 存在但跑不起来时
      # Theos 不会自动回落，会直接 internal-package Error 2。所以先验证再决定。
      - name: Install packaging tools
        if: always()
        run: |
          brew install dpkg 2>&1 | tail -3 || true
          command -v dpkg-deb && dpkg-deb --version | head -1 || echo "无 dpkg-deb"
          echo "=== 测试 dm.pl ==="
          if [ -f "$HOME/theos/bin/dm.pl" ]; then
            if perl "$HOME/theos/bin/dm.pl" --help >/dev/null 2>&1; then
              echo "dm.pl 可用"
            else
              echo "dm.pl 不可用，移除以强制回落到 dpkg-deb"
              mv "$HOME/theos/bin/dm.pl" "$HOME/theos/bin/dm.pl.disabled"
            fi
          else
            echo "dm.pl 不存在，将使用 dpkg-deb"
          fi
          perl -e 'print "perl ok\n"'

      - name: Build Tweak
        id: tweak
        if: always()
        continue-on-error: true
        working-directory: tweak
        run: |
          set -o pipefail
          make clean package \
            THEOS=$HOME/theos \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1 2>&1 | tee /tmp/theos.log | tail -80

      - name: 诊断 Tweak 构建错误
        if: always() && steps.tweak.outcome != 'success'
        run: |
          echo "===== theos 日志尾部 ====="
          tail -60 /tmp/theos.log 2>/dev/null || echo "无日志文件"
          echo "===== 打包工具 ====="
          ls -la "$HOME/theos/bin/" 2>/dev/null || echo "无 theos/bin"
          command -v dpkg-deb || echo "无 dpkg-deb"
          command -v fakeroot || echo "无 fakeroot"
          echo "===== 逐行进 annotation ====="
          tail -60 /tmp/theos.log 2>/dev/null | sed 's/%/%25/g; s/\r//g' | while IFS= read -r l; do
            [ -n "$l" ] && echo "::error title=theos::$l"
          done

      - name: Show package info
        if: always()
        run: |
          ls -la tweak/packages/ || true
          for f in tweak/packages/*.deb; do
            echo "== $f =="
            dpkg-deb -I "$f" 2>/dev/null || true
          done

      # ── 产物 ─────────────────────────────────────────
      - name: Upload .tipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callguard-app
          path: CallGuard.tipa
          if-no-files-found: warn

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callguard-tweak
          path: tweak/packages/*.deb
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/xcodebuild.log
            /tmp/theos.log
          if-no-files-found: ignore

      - name: 汇总结果
        if: always()
        run: |
          echo "App   outcome: ${{ steps.app.outcome }}"
          echo "Tweak outcome: ${{ steps.tweak.outcome }}"
          echo "::notice title=outcome::app=${{ steps.app.outcome }} tweak=${{ steps.tweak.outcome }}"
          if [ "${{ steps.app.outcome }}" != "success" ] || [ "${{ steps.tweak.outcome }}" != "success" ]; then
            echo "::error::构建未全部成功，见上方诊断步骤"
            exit 1
          fi

      # 把日志推回 ci-logs 分支。artifact 下载需要登录，这条路不需要。
      - name: 回传构建日志
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .ci-logs
          cp /tmp/theos.log .ci-logs/theos.log 2>/dev/null || echo "无 theos.log" > .ci-logs/theos.log
          cp /tmp/xcodebuild.log .ci-logs/xcodebuild.log 2>/dev/null || echo "无 xcodebuild.log" > .ci-logs/xcodebuild.log
          ls -la .ci-logs
          git config user.name "ci-bot"
          git config user.email "ci-bot@localhost"
          git checkout -b ci-logs 2>/dev/null || git checkout ci-logs
          git add -f .ci-logs
          git commit -m "ci: 构建日志 [skip ci]" || echo "无变化"
          git push -f origin ci-logs || echo "推送日志失败"
