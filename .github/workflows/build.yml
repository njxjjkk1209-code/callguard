name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # ───────────── 规则引擎算法验证（秒级反馈，先挂再说）─────────────
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 算法用例
        run: python tests/run_tests.py

      - name: 种子规则行为
        run: python tools/simulate.py

      - name: App ↔ Tweak 配置格式一致性
        run: python tools/verify_tweak_config.py

      - name: 规则自动升级阈值
        run: python tools/verify_promotion.py

  # ───────────── C++ 核心库编译 + 单元测试 ─────────────
  # 用 ubuntu 而不是 macOS：标准 C++17，g++ 完全够用，还省 macOS 额度
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra \
            tests/test_core.cpp -o /tmp/test_core

      - name: Run tests
        run: /tmp/test_core

  # ───────────── iOS 产物：App(.tipa) + Tweak(.deb) ─────────────
  # 合并成一个 job 的原因：macOS runner 每次分配都要排队，
  # 拆成两个 job 等于排两次队。串行编译只排一次。
  # 用 macos-15 的原因：macos-13 已于 2025-12 退役，标签仍在但无容量，
  # 表现为永远 queued、runner 未分配。
  build-ios:
    runs-on: macos-15
    needs: [test-core]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 环境探测
        run: |
          echo "=== runner ==="
          uname -m
          sw_vers
          echo "=== xcode ==="
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # ── App ──────────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build App
        id: app
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project CallGuard.xcodeproj \
            -scheme CallGuard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log | tail -80

      - name: Package .tipa
        if: steps.app.outcome == 'success'
        run: |
          set -e
          APP=$(find app/build -type d -name "CallGuard.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP" ]; then
            echo "找不到 CallGuard.app"
            exit 1
          fi
          echo "找到 $APP"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/

          # 先签 extension 再签主 App。TrollStore 安装时保留这里的 entitlements
          codesign --force --sign - \
            --entitlements app/CallGuardDirectory/CallGuardDirectory.entitlements \
            Payload/CallGuard.app/PlugIns/CallGuardDirectory.appex || true
          codesign --force --sign - \
            --entitlements app/CallGuard/CallGuard.entitlements \
            Payload/CallGuard.app || true

          codesign -d --entitlements - Payload/CallGuard.app 2>&1 || true

          zip -qry CallGuard.tipa Payload
          ls -lh CallGuard.tipa

      # ── Tweak ────────────────────────────────────────
      # App 编挂了也继续编 Tweak，一次拿到两边的错误，避免反复排队
      - name: Install Theos
        if: always()
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install SDKs
        if: always()
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$HOME/theos/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$HOME/theos/sdks/" || true
          ls "$HOME/theos/sdks"

      - name: Build Tweak
        id: tweak
        if: always()
        continue-on-error: true
        working-directory: tweak
        run: |
          set -o pipefail
          make clean package \
            THEOS=$HOME/theos \
            THEOS_PACKAGE_SCHEME=rootless \
            FINALPACKAGE=1 2>&1 | tee /tmp/theos.log | tail -80

      - name: Show package info
        if: always()
        run: |
          ls -la tweak/packages/ || true
          for f in tweak/packages/*.deb; do
            echo "== $f =="
            dpkg-deb -I "$f" 2>/dev/null || true
          done

      # ── 产物 ─────────────────────────────────────────
      - name: Upload .tipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callguard-app
          path: CallGuard.tipa
          if-no-files-found: warn

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callguard-tweak
          path: tweak/packages/*.deb
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/xcodebuild.log
            /tmp/theos.log
          if-no-files-found: ignore

      - name: 汇总结果
        if: always()
        run: |
          echo "App   : ${{ steps.app.outcome }}"
          echo "Tweak : ${{ steps.tweak.outcome }}"
          if [ "${{ steps.app.outcome }}" != "success" ] || [ "${{ steps.tweak.outcome }}" != "success" ]; then
            echo "::error::构建未全部成功，请下载 build-logs 查看原因"
            exit 1
          fi
